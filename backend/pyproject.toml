[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralshelf-backend"
version = "0.1.0"
description = "NeuralShelf document knowledge base and RAG backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "pgvector>=0.3,<1.0",
    "httpx>=0.27,<1.0",
    "pypdf>=5.0,<7.0",
    "pyjwt>=2.10,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "python-multipart>=0.0.18,<1.0",
    "email-validator>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -m 'not evaluation'"
markers = [
    "integration: requires a running PostgreSQL database with pgvector",
    "evaluation: retrieval and answer-quality evaluations against a live Ollama server",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic generates these; they keep its formatting.
extend-exclude = ["src/neuralshelf/db/migrations"]

[tool.ruff.lint]
# D: docstrings (Google style) on every public module, class and function.
select = ["E", "F", "I", "UP", "B", "D"]
# __init__ is documented on its class; magic methods explain themselves.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are documented by their names.
"tests/**" = ["D"]
