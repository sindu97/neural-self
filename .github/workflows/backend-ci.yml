name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", "infra/**", "docker-compose.yml", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "infra/**", "docker-compose.yml", ".github/workflows/backend-ci.yml"]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  DATABASE_URL: postgresql://neuralshelf:neuralshelf_ci@localhost:5432/neuralshelf
  JWT_SECRET_KEY: ci-only-signing-key-not-used-anywhere-else-0123456789
  APP_ENV: testing

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests --exclude src/neuralshelf/db/migrations

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: neuralshelf
          POSTGRES_USER: neuralshelf
          POSTGRES_PASSWORD: neuralshelf_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neuralshelf -d neuralshelf"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"

      # Build the schema from an empty database using migrations alone,
      # through the same commands developers use.
      - name: Migrations apply from scratch
        run: python -m neuralshelf.cli migrate
      - name: Models match the migrated schema
        run: alembic check
      - name: Rollback, fresh and seed commands work
        run: |
          python -m neuralshelf.cli migrate:rollback --steps 8
          python -m neuralshelf.cli migrate
          python -m neuralshelf.cli migrate:fresh --yes --seed
          python -m neuralshelf.cli migrate:status

      # Unit and integration tests; evaluation tests need Ollama and are skipped.
      - name: Tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production image builds
        run: docker build -t neuralshelf-backend:ci .
      - name: Image runs as a non-root user
        run: test "$(docker run --rm neuralshelf-backend:ci id -u)" != "0"
